spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: brand-route
          uri: lb://brand-service
          predicates:
            - Path=/api/brands/**

        - id: phone-route
          uri: lb://phone-service
          predicates:
            - Path=/api/phones/**

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
